name: Feature request
description: Suggest a feature or catalog improvement for WindowsLab.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WindowsLab is evidence-backed (grades OFFICIAL/STRONG/…). Unknown/experimental items are not recommended by default. Do **not** propose porting ChrisTitusTech/winutil JSON or InvokeScript handlers.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user job is hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete UI / CLI / catalog change. Include evidence grade if it mutates Windows.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - UI (Inicio / Ajustes / Apps / Rendimiento / Más)
        - Catalog tweak
        - Catalog app (winget)
        - CLI
        - Docs / packaging
        - Other
    validations:
      required: true
